name: Agent lifecycle

on:
  issues:
    types: [closed, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: agent-lifecycle-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reconcile ticket frontier and parent state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/reconcile-agent-lifecycle.py
