# Top-level Codex settings this harness owns. Everything else in
# ~/.codex/config.toml is machine state: per-project trust decisions, hook
# hashes, marketplace entries, and the engram MCP server and instruction file
# paths, all written by tools rather than by hand.
#
# The [tui] status line is owned too, by statusline/codex.sh, because it is a
# rendering concern shared with the Claude renderer beside it.
model = "gpt-5.6-luna"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "xhigh"
